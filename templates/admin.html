<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Super Yodha — Admin Command Center</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top,
                #16254a,
                #050816 55%,
                #02030a);

            color: white;
            min-height: 100vh;
        }

        /* =====================================
           HEADER
        ===================================== */

        header {
            padding: 25px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;

            border-bottom: 1px solid rgba(255,255,255,0.1);

            background: rgba(3, 7, 18, 0.8);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .logo span {
            color: #6ee7ff;
        }

        .back-home {
            color: #6ee7ff;
            text-decoration: none;
            border: 1px solid #6ee7ff;
            padding: 10px 18px;
            border-radius: 8px;
        }

        .back-home:hover {
            background: #6ee7ff;
            color: #02030a;
        }


        /* =====================================
           MAIN
        ===================================== */

        main {
            width: 90%;
            max-width: 1400px;
            margin: 50px auto;
        }

        .page-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-title h1 {
            font-size: 42px;
            letter-spacing: 4px;
        }

        .page-title p {
            margin-top: 10px;
            color: #9caecb;
        }


        /* =====================================
           DASHBOARD CARDS
        ===================================== */

        .dashboard {
            display: grid;
            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            padding: 25px;

            background:
                rgba(255,255,255,0.05);

            border:
                1px solid rgba(110,231,255,0.2);

            border-radius: 15px;

            text-align: center;

            transition: 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);

            border-color: #6ee7ff;

            box-shadow:
                0 0 25px rgba(110,231,255,0.2);
        }

        .stat-card h3 {
            font-size: 15px;
            color: #9caecb;
            margin-bottom: 12px;
        }

        .stat-number {
            font-size: 38px;
            font-weight: bold;
            color: #6ee7ff;
        }


        /* =====================================
           CONTROLS
        ===================================== */

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .controls input,
        .controls select,
        .controls button {

            padding: 12px 15px;

            border-radius: 8px;

            border:
                1px solid rgba(255,255,255,0.15);

            background:
                rgba(255,255,255,0.06);

            color: white;

            outline: none;
        }

        .controls input {
            flex: 1;
            min-width: 250px;
        }

        .controls select {
            min-width: 170px;
        }

        .controls select option {
            background: #050816;
            color: white;
        }

        .controls button {
            cursor: pointer;
            border-color: #6ee7ff;
            color: #6ee7ff;
        }

        .controls button:hover {
            background: #6ee7ff;
            color: #02030a;
        }


        /* =====================================
           TABLE
        ===================================== */

        .table-container {
            overflow-x: auto;

            border:
                1px solid rgba(255,255,255,0.1);

            border-radius: 15px;

            background:
                rgba(255,255,255,0.04);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1100px;
        }

        th,
        td {
            padding: 16px;
            text-align: left;

            border-bottom:
                1px solid rgba(255,255,255,0.08);
        }

        th {
            color: #6ee7ff;
            background: rgba(110,231,255,0.05);
            font-size: 14px;
        }

        td {
            color: #dbe7f7;
            font-size: 14px;
        }

        tr:hover td {
            background:
                rgba(110,231,255,0.04);
        }


        /* =====================================
           STATUS
        ===================================== */

        .status-select {
            padding: 8px 10px;

            border-radius: 7px;

            background: #080d20;
            color: white;

            border:
                1px solid rgba(255,255,255,0.2);

            cursor: pointer;
        }

        .status-select:focus {
            border-color: #6ee7ff;
        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 900px) {

            .dashboard {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        @media (max-width: 600px) {

            .dashboard {
                grid-template-columns: 1fr;
            }

            .page-title h1 {
                font-size: 28px;
            }

            header {
                padding: 20px;
            }

            main {
                width: 94%;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        SUPER <span>YODHA</span>
    </div>

    <a href="/" class="back-home">
        ← Back to Website
    </a>

</header>



<main>


    <div class="page-title">

        <h1>ADMIN COMMAND CENTER</h1>

        <p>
            Guardian Request Monitoring System
        </p>

    </div>



    <!-- =====================================
         STATISTICS
    ====================================== -->

    <section class="dashboard">

        <div class="stat-card">

            <h3>TOTAL REQUESTS</h3>

            <div
                class="stat-number"
                id="totalRequests">
                0
            </div>

        </div>


        <div class="stat-card">

            <h3>PENDING</h3>

            <div
                class="stat-number"
                id="pendingRequests">
                0
            </div>

        </div>


        <div class="stat-card">

            <h3>IN PROGRESS</h3>

            <div
                class="stat-number"
                id="progressRequests">
                0
            </div>

        </div>


        <div class="stat-card">

            <h3>RESOLVED</h3>

            <div
                class="stat-number"
                id="resolvedRequests">
                0
            </div>

        </div>

    </section>



    <!-- =====================================
         SEARCH AND FILTER
    ====================================== -->

    <section class="controls">

        <input
            type="text"
            id="searchInput"
            placeholder="Search name, email or grievance..."
        >


        <select id="statusFilter">

            <option value="All">
                All Status
            </option>

            <option value="Pending">
                Pending
            </option>

            <option value="In Progress">
                In Progress
            </option>

            <option value="Resolved">
                Resolved
            </option>

        </select>


        <button
            onclick="loadRequests()">

            ↻ Refresh

        </button>

    </section>



    <!-- =====================================
         REQUEST TABLE
    ====================================== -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Age</th>

                    <th>Location</th>

                    <th>Email</th>

                    <th>Grievance</th>

                    <th>Submitted</th>

                    <th>Status</th>

                </tr>

            </thead>


            <tbody id="requestTable">

                <tr>

                    <td colspan="8"
                        style="text-align:center;">

                        Loading requests...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>


</main>


<script>

    // ==========================================
    // LOAD REQUESTS
    // ==========================================

    async function loadRequests() {

        try {

            const response =
                await fetch("/admin/requests");

            const data =
                await response.json();


            if (!data.success) {
                return;
            }


            displayRequests(data.requests);

        }

        catch (error) {

            console.error(
                "Error loading requests:",
                error
            );

        }

    }


    // ==========================================
    // DISPLAY REQUESTS
    // ==========================================

    function displayRequests(requests) {

        const table =
            document.getElementById(
                "requestTable"
            );


        table.innerHTML = "";


        if (requests.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="8"
                        style="text-align:center;">
                        No requests found.
                    </td>
                </tr>
            `;

            updateStatistics([]);

            return;
        }


        requests.forEach(request => {

            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>#${request.id}</td>

                <td>${escapeHTML(request.name)}</td>

                <td>${escapeHTML(request.age)}</td>

                <td>${escapeHTML(request.location)}</td>

                <td>${escapeHTML(request.email)}</td>

                <td>${escapeHTML(request.grievance)}</td>

                <td>${escapeHTML(request.submitted_at)}</td>

                <td>

                    <select
                        class="status-select"
                        onchange="changeStatus(
                            ${request.id},
                            this.value
                        )">

                        <option
                            value="Pending"
                            ${request.status === "Pending" ? "selected" : ""}>
                            Pending
                        </option>

                        <option
                            value="In Progress"
                            ${request.status === "In Progress" ? "selected" : ""}>
                            In Progress
                        </option>

                        <option
                            value="Resolved"
                            ${request.status === "Resolved" ? "selected" : ""}>
                            Resolved
                        </option>

                    </select>

                </td>

            `;


            table.appendChild(row);

        });


        updateStatistics(requests);

    }


    // ==========================================
    // UPDATE STATISTICS
    // ==========================================

    function updateStatistics(requests) {

        const total =
            requests.length;


        const pending =
            requests.filter(
                r => r.status === "Pending"
            ).length;


        const progress =
            requests.filter(
                r => r.status === "In Progress"
            ).length;


        const resolved =
            requests.filter(
                r => r.status === "Resolved"
            ).length;


        document.getElementById(
            "totalRequests"
        ).textContent = total;


        document.getElementById(
            "pendingRequests"
        ).textContent = pending;


        document.getElementById(
            "progressRequests"
        ).textContent = progress;


        document.getElementById(
            "resolvedRequests"
        ).textContent = resolved;

    }


    // ==========================================
    // CHANGE STATUS
    // ==========================================

    async function changeStatus(id, status) {

        try {

            const response =
                await fetch(
                    "/update-status",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            id: id,
                            status: status
                        })
                    }
                );


            const data =
                await response.json();


            if (!data.success) {

                alert(
                    data.message ||
                    "Unable to update status."
                );

                loadRequests();

                return;
            }


            alert(
                "Request status updated successfully."
            );


            loadRequests();

        }

        catch (error) {

            console.error(
                "Status update error:",
                error
            );

            alert(
                "Unable to update request status."
            );

        }

    }


    // ==========================================
    // SEARCH
    // ==========================================

    document
        .getElementById("searchInput")
        .addEventListener(
            "input",
            filterRequests
        );


    document
        .getElementById("statusFilter")
        .addEventListener(
            "change",
            filterRequests
        );


    let allRequests = [];


    async function filterRequests() {

        const search =
            document
                .getElementById("searchInput")
                .value
                .toLowerCase();


        const status =
            document
                .getElementById("statusFilter")
                .value;


        const filtered =
            allRequests.filter(request => {

                const matchesSearch =

                    request.name
                        .toLowerCase()
                        .includes(search)

                    ||

                    request.email
                        .toLowerCase()
                        .includes(search)

                    ||

                    request.grievance
                        .toLowerCase()
                        .includes(search);


                const matchesStatus =

                    status === "All"

                    ||

                    request.status === status;


                return (
                    matchesSearch &&
                    matchesStatus
                );

            });


        displayRequests(filtered);

    }


    // ==========================================
    // HTML SECURITY
    // ==========================================

    function escapeHTML(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    // ==========================================
    // INITIAL LOAD
    // ==========================================

    loadRequests();

</script>


</body>

</html>
